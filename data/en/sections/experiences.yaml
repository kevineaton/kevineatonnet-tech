    - Utilized Terraform, Ansible, Docker, and Packer to manage systems, infrastructure, and users, including migrating several legacy custom systems to new, standards-based tooling
    - Wrote Go, Python, and Java to solve business needs, providing notification services to end-users, delivering thousands of notifications per minute in an affordable and scalable manner
    - Set up and maintained several observability stacks, including Loki, Grafana, Tempo, Prometheus, Signoz, and AWS-native tools while spearheading cybersecurity efforts and SOC2 compliance auditing
    - Mentored and guided dozens of engineers across teams, products, and technical stacks


