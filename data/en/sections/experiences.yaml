    - Manages the full Developer and Operations lifecycle for a cutting-edge education technology company that leverages cloud, AI, agentic, and local technology solutions
    - Founded, built, and supervises a team of cross-functional engineers and administrators to ensure uptime, reliability, scalability, and security
