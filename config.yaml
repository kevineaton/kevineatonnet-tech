baseURL: https://tech.kevineaton.net

languageCode: en-us
title: "Kevin Eaton, PhD - Technology"

module:
  imports:
  - path: github.com/hugo-toha/toha/v4
  mounts:
  - source: static/files
    target: static/files
  - source: ./node_modules/flag-icon-css/flags
    target: static/flags
  - source: ./node_modules/@fontsource/mulish/files
    target: static/files
  - source: ./node_modules/katex/dist/fonts
    target: static/fonts

languages:
  en:
    languageName: English
    weight: 1

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

enableEmoji: true

params:
  background: /images/site/background.jpg

  # logo:
  #   main: /images/site/main-logo.png       # add your logo to assets/images/site/
  #   inverted: /images/site/inverted-logo.png
  #   favicon: /images/site/favicon.png

  topNavbar:
    maxVisibleSections: 5

  features:
    darkMode:
      enable: true

    portfolio:
      enable: false

    blog:
      enable: false

    notes:
      enable: false

    comment:
      enable: false

    analytics:
      enabled: false

    support:
      enable: false

    toc:
      enable: true

    tags:
      enable: true
      on_card: true

    flags:
      enable: false

    embedpdf:
      enable: true

    syntaxHighlight:
      enable: true
      services:
        hljs:
          noHighlightRe: /^no-highlight$/i

    readingTime:
      enable: false

    pagination:
      maxPostsPerPage: 12

  footer:
    enable: true
    template: footer.html
    navigation:
      enable: true
      customMenus: true
    contactMe:
      enable: true
    credentials:
      enable: true
    newsletter:
      enable: false
    disclaimer:
      enable: false
